spring.application.name=pedidos

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: genera la tabla "pedido" a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Documentacion OpenAPI / Swagger UI (springdoc-openapi)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Documentar solo las respuestas declaradas con @ApiResponse en cada operacion
# (evita que el 404 del @RestControllerAdvice aparezca tambien en el POST)
springdoc.override-with-generic-response=false
